name: Build Cross-Platform Test Executables

on:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.13"
  JAVA_VERSION: "21"
  UPX_VERSION: "5.1.1"
  POI_VERSION: "5.3.0"
  XMLBEANS_VERSION: "5.2.1"
  COMMONS_COLLECTIONS4_VERSION: "4.4"
  COMMONS_IO_VERSION: "2.16.1"
  COMMONS_COMPRESS_VERSION: "1.26.2"
  COMMONS_CODEC_VERSION: "1.17.1"
  LOG4J_API_VERSION: "2.24.1"

jobs:
  build-windows:
    runs-on: [self-hosted, Windows, X64, 233]
    strategy:
      fail-fast: false
      matrix:
        include_jre: [false, true]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Get version
        id: version
        shell: powershell
        run: |
          $versionString = (Get-Content version.py -Raw) -match '__version__ = "(.+)"' | ForEach-Object { $matches[1] }
          if (-not $versionString) { throw "version.py에서 __version__을 찾을 수 없습니다." }
          echo "version=$versionString" >> $env:GITHUB_OUTPUT
          if ("${{ matrix.include_jre }}" -eq "true") {
            echo "asset=ExcelMerger-test-$versionString-Windows-x64-jre" >> $env:GITHUB_OUTPUT
          } else {
            echo "asset=ExcelMerger-test-$versionString-Windows-x64" >> $env:GITHUB_OUTPUT
          }

      - name: Install Python dependencies
        shell: powershell
        run: |
          python -m venv venv
          .\venv\Scripts\python.exe -m pip install --upgrade pip
          .\venv\Scripts\pip.exe install -r requirements.txt pyinstaller

      - name: Download Apache POI jars
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path lib\poi | Out-Null
          $downloads = @(
            "https://repo1.maven.org/maven2/org/apache/poi/poi/$env:POI_VERSION/poi-$env:POI_VERSION.jar",
            "https://repo1.maven.org/maven2/org/apache/poi/poi-ooxml/$env:POI_VERSION/poi-ooxml-$env:POI_VERSION.jar",
            "https://repo1.maven.org/maven2/org/apache/poi/poi-ooxml-lite/$env:POI_VERSION/poi-ooxml-lite-$env:POI_VERSION.jar",
            "https://repo1.maven.org/maven2/org/apache/commons/commons-collections4/$env:COMMONS_COLLECTIONS4_VERSION/commons-collections4-$env:COMMONS_COLLECTIONS4_VERSION.jar",
            "https://repo1.maven.org/maven2/commons-io/commons-io/$env:COMMONS_IO_VERSION/commons-io-$env:COMMONS_IO_VERSION.jar",
            "https://repo1.maven.org/maven2/org/apache/commons/commons-compress/$env:COMMONS_COMPRESS_VERSION/commons-compress-$env:COMMONS_COMPRESS_VERSION.jar",
            "https://repo1.maven.org/maven2/commons-codec/commons-codec/$env:COMMONS_CODEC_VERSION/commons-codec-$env:COMMONS_CODEC_VERSION.jar",
            "https://repo1.maven.org/maven2/org/apache/xmlbeans/xmlbeans/$env:XMLBEANS_VERSION/xmlbeans-$env:XMLBEANS_VERSION.jar",
            "https://repo1.maven.org/maven2/org/apache/logging/log4j/log4j-api/$env:LOG4J_API_VERSION/log4j-api-$env:LOG4J_API_VERSION.jar"
          )
          foreach ($url in $downloads) {
            $target = Join-Path "lib\poi" ([System.IO.Path]::GetFileName($url))
            Invoke-WebRequest -Uri $url -OutFile $target
          }

      - name: Bundle JRE
        if: matrix.include_jre
        shell: powershell
        run: |
          Remove-Item -Recurse -Force lib\jre -ErrorAction SilentlyContinue
          Copy-Item -Recurse -Force $env:JAVA_HOME lib\jre

      - name: Install UPX
        shell: powershell
        run: |
          $url = "https://github.com/upx/upx/releases/download/v$env:UPX_VERSION/upx-$env:UPX_VERSION-win64.zip"
          $zip = Join-Path $env:RUNNER_TEMP "upx-$env:UPX_VERSION.zip"
          $extract = Join-Path $env:RUNNER_TEMP "upx-$env:UPX_VERSION"
          Invoke-WebRequest -Uri $url -OutFile $zip
          if (Test-Path $extract) { Remove-Item -Recurse -Force $extract }
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $upxBin = (Get-ChildItem -Path $extract -Recurse -Filter upx.exe | Select-Object -First 1).Directory.FullName
          if (-not $upxBin) { throw "upx.exe not found inside $extract" }
          Add-Content $env:GITHUB_PATH $upxBin
          & "$upxBin\upx.exe" --version

      - name: Build executable
        shell: powershell
        run: |
          $env:EXCELMERGER_INCLUDE_JRE = if ("${{ matrix.include_jre }}" -eq "true") { "1" } else { "0" }
          .\venv\Scripts\pyinstaller.exe ExcelMerger.spec

      - name: Wait for build artifacts to release
        shell: powershell
        run: |
          $exe = "dist\ExcelMerger\ExcelMerger.exe"
          $deadline = (Get-Date).AddSeconds(120)
          while ((Get-Date) -lt $deadline) {
            try {
              $fh = [System.IO.File]::Open($exe, 'Open', 'Read', 'None')
              $fh.Dispose()
              break
            } catch {
              Write-Host "Waiting for $exe to be released..."
              Start-Sleep -Seconds 3
            }
          }

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.asset }}
          path: dist/ExcelMerger/

  build-linux:
    runs-on: [self-hosted, Linux, X64, 235]
    strategy:
      fail-fast: false
      matrix:
        include_jre: [false, true]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Get version
        id: version
        run: |
          version=$(sed -n 's/.*__version__ = "\([^"]*\)".*/\1/p' version.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ matrix.include_jre }}" = "true" ]; then
            echo "asset=ExcelMerger-test-$version-Linux-x64-jre" >> "$GITHUB_OUTPUT"
          else
            echo "asset=ExcelMerger-test-$version-Linux-x64" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Python dependencies
        run: |
          python3 -m venv venv
          ./venv/bin/python -m pip install --upgrade pip
          ./venv/bin/pip install -r requirements.txt pyinstaller

      - name: Download Apache POI jars
        run: |
          mkdir -p lib/poi
          curl -fsSL -o lib/poi/poi-${POI_VERSION}.jar https://repo1.maven.org/maven2/org/apache/poi/poi/${POI_VERSION}/poi-${POI_VERSION}.jar
          curl -fsSL -o lib/poi/poi-ooxml-${POI_VERSION}.jar https://repo1.maven.org/maven2/org/apache/poi/poi-ooxml/${POI_VERSION}/poi-ooxml-${POI_VERSION}.jar
          curl -fsSL -o lib/poi/poi-ooxml-lite-${POI_VERSION}.jar https://repo1.maven.org/maven2/org/apache/poi/poi-ooxml-lite/${POI_VERSION}/poi-ooxml-lite-${POI_VERSION}.jar
          curl -fsSL -o lib/poi/commons-collections4-${COMMONS_COLLECTIONS4_VERSION}.jar https://repo1.maven.org/maven2/org/apache/commons/commons-collections4/${COMMONS_COLLECTIONS4_VERSION}/commons-collections4-${COMMONS_COLLECTIONS4_VERSION}.jar
          curl -fsSL -o lib/poi/commons-io-${COMMONS_IO_VERSION}.jar https://repo1.maven.org/maven2/commons-io/commons-io/${COMMONS_IO_VERSION}/commons-io-${COMMONS_IO_VERSION}.jar
          curl -fsSL -o lib/poi/commons-compress-${COMMONS_COMPRESS_VERSION}.jar https://repo1.maven.org/maven2/org/apache/commons/commons-compress/${COMMONS_COMPRESS_VERSION}/commons-compress-${COMMONS_COMPRESS_VERSION}.jar
          curl -fsSL -o lib/poi/commons-codec-${COMMONS_CODEC_VERSION}.jar https://repo1.maven.org/maven2/commons-codec/commons-codec/${COMMONS_CODEC_VERSION}/commons-codec-${COMMONS_CODEC_VERSION}.jar
          curl -fsSL -o lib/poi/xmlbeans-${XMLBEANS_VERSION}.jar https://repo1.maven.org/maven2/org/apache/xmlbeans/xmlbeans/${XMLBEANS_VERSION}/xmlbeans-${XMLBEANS_VERSION}.jar
          curl -fsSL -o lib/poi/log4j-api-${LOG4J_API_VERSION}.jar https://repo1.maven.org/maven2/org/apache/logging/log4j/log4j-api/${LOG4J_API_VERSION}/log4j-api-${LOG4J_API_VERSION}.jar

      - name: Bundle JRE
        if: matrix.include_jre
        run: |
          rm -rf lib/jre
          cp -R "$JAVA_HOME" lib/jre

      - name: Install UPX
        run: |
          if [ "$(uname -s)" = "Darwin" ]; then
            brew list upx >/dev/null 2>&1 || brew install upx
          else
            UPX_DIR="$RUNNER_TEMP/upx-${UPX_VERSION}"
            mkdir -p "$UPX_DIR"
            curl -fsSL -o "$UPX_DIR/upx.tar.xz" \
              "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/upx-${UPX_VERSION}-amd64_linux.tar.xz"
            tar -xJf "$UPX_DIR/upx.tar.xz" -C "$UPX_DIR" --strip-components=1
            echo "$UPX_DIR" >> "$GITHUB_PATH"
            export PATH="$UPX_DIR:$PATH"
          fi
          upx --version

      - name: Build executable
        run: |
          EXCELMERGER_INCLUDE_JRE=${{ matrix.include_jre && '1' || '0' }} ./venv/bin/pyinstaller ExcelMerger.spec

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.asset }}
          path: dist/ExcelMerger/

