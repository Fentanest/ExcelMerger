name: Build Linux Test Executables

on:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.13"
  JAVA_VERSION: "21"
  POI_VERSION: "5.3.0"
  XMLBEANS_VERSION: "5.2.1"
  COMMONS_COLLECTIONS4_VERSION: "4.4"
  COMMONS_IO_VERSION: "2.16.1"
  COMMONS_COMPRESS_VERSION: "1.26.2"
  COMMONS_CODEC_VERSION: "1.17.1"
  LOG4J_API_VERSION: "2.24.1"

jobs:
  build-linux:
    runs-on: [self-hosted, Linux, X64, 235]
    strategy:
      fail-fast: false
      matrix:
        include_jre: [false, true]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Get version
        id: version
        run: |
          version=$(sed -n 's/.*__version__ = "\([^"]*\)".*/\1/p' version.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ matrix.include_jre }}" = "true" ]; then
            echo "asset=ExcelMerger-test-$version-Linux-x64-jre.tar.gz" >> "$GITHUB_OUTPUT"
          else
            echo "asset=ExcelMerger-test-$version-Linux-x64.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Python dependencies
        run: |
          python3 -m venv venv
          ./venv/bin/python -m pip install --upgrade pip
          ./venv/bin/pip install -r requirements.txt pyinstaller

      - name: Download Apache POI jars
        run: |
          mkdir -p lib/poi
          curl -fsSL -o lib/poi/poi-${POI_VERSION}.jar https://repo1.maven.org/maven2/org/apache/poi/poi/${POI_VERSION}/poi-${POI_VERSION}.jar
          curl -fsSL -o lib/poi/poi-ooxml-${POI_VERSION}.jar https://repo1.maven.org/maven2/org/apache/poi/poi-ooxml/${POI_VERSION}/poi-ooxml-${POI_VERSION}.jar
          curl -fsSL -o lib/poi/poi-ooxml-lite-${POI_VERSION}.jar https://repo1.maven.org/maven2/org/apache/poi/poi-ooxml-lite/${POI_VERSION}/poi-ooxml-lite-${POI_VERSION}.jar
          curl -fsSL -o lib/poi/commons-collections4-${COMMONS_COLLECTIONS4_VERSION}.jar https://repo1.maven.org/maven2/org/apache/commons/commons-collections4/${COMMONS_COLLECTIONS4_VERSION}/commons-collections4-${COMMONS_COLLECTIONS4_VERSION}.jar
          curl -fsSL -o lib/poi/commons-io-${COMMONS_IO_VERSION}.jar https://repo1.maven.org/maven2/commons-io/commons-io/${COMMONS_IO_VERSION}/commons-io-${COMMONS_IO_VERSION}.jar
          curl -fsSL -o lib/poi/commons-compress-${COMMONS_COMPRESS_VERSION}.jar https://repo1.maven.org/maven2/org/apache/commons/commons-compress/${COMMONS_COMPRESS_VERSION}/commons-compress-${COMMONS_COMPRESS_VERSION}.jar
          curl -fsSL -o lib/poi/commons-codec-${COMMONS_CODEC_VERSION}.jar https://repo1.maven.org/maven2/commons-codec/commons-codec/${COMMONS_CODEC_VERSION}/commons-codec-${COMMONS_CODEC_VERSION}.jar
          curl -fsSL -o lib/poi/xmlbeans-${XMLBEANS_VERSION}.jar https://repo1.maven.org/maven2/org/apache/xmlbeans/xmlbeans/${XMLBEANS_VERSION}/xmlbeans-${XMLBEANS_VERSION}.jar
          curl -fsSL -o lib/poi/log4j-api-${LOG4J_API_VERSION}.jar https://repo1.maven.org/maven2/org/apache/logging/log4j/log4j-api/${LOG4J_API_VERSION}/log4j-api-${LOG4J_API_VERSION}.jar

      - name: Bundle JRE
        if: matrix.include_jre
        run: |
          rm -rf lib/jre
          cp -R "$JAVA_HOME" lib/jre

      - name: Build executable
        run: |
          EXCELMERGER_INCLUDE_JRE=${{ matrix.include_jre && '1' || '0' }} ./venv/bin/pyinstaller ExcelMerger.spec

      - name: Package artifact
        run: |
          mkdir -p release
          tar -czf "release/${{ steps.version.outputs.asset }}" -C dist ExcelMerger

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.asset }}
          path: release/${{ steps.version.outputs.asset }}
