name: Build macOS x64 Test Executables

on:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.14"
  JAVA_VERSION: "21"
  UPX_VERSION: "5.1.1"
  POI_VERSION: "5.3.0"
  XMLBEANS_VERSION: "5.2.1"
  COMMONS_COLLECTIONS4_VERSION: "4.4"
  COMMONS_IO_VERSION: "2.16.1"
  COMMONS_COMPRESS_VERSION: "1.26.2"
  COMMONS_CODEC_VERSION: "1.17.1"
  LOG4J_API_VERSION: "2.24.1"

jobs:
  build-macos-x64:
    runs-on: [self-hosted, macOS, X64, 236]
    strategy:
      fail-fast: false
      matrix:
        include_jre: [false, true]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Resolve local Python 3.14
        id: python
        env:
          MACOS_X64_PYTHON: ${{ vars.MACOS_X64_PYTHON }}
        run: |
          set -euo pipefail

          CANDIDATES=()
          if [ -n "${MACOS_X64_PYTHON:-}" ]; then
            CANDIDATES+=("$MACOS_X64_PYTHON")
          fi
          CANDIDATES+=(
            "/Library/Frameworks/Python.framework/Versions/3.14/bin/python3.14"
            "/usr/local/bin/python3.14"
            "/opt/homebrew/bin/python3.14"
          )

          FOUND=""
          for candidate in "${CANDIDATES[@]}"; do
            if [ -x "$candidate" ]; then
              FOUND="$candidate"
              break
            fi
          done

          if [ -z "$FOUND" ]; then
            echo "::error::Python 3.14 실행 파일을 찾지 못했습니다."
            echo "::error::self-hosted macOS runner에 Python 3.14를 설치하고, 필요하면 GitHub repository variable 'MACOS_X64_PYTHON' 에 경로를 지정하세요."
            exit 1
          fi

          PYTHON_BIN="$FOUND"
          PYTHON_VERSION=$("$PYTHON_BIN" -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')
          ARCHS=$(lipo -archs "$PYTHON_BIN")
          echo "Using Python: $PYTHON_BIN"
          echo "Version: $PYTHON_VERSION"
          echo "Architectures: $ARCHS"

          case "$PYTHON_VERSION" in
            3.14.*)
              ;;
            *)
              echo "::error::Python 3.14가 필요하지만 현재 버전은 $PYTHON_VERSION 입니다."
              exit 1
              ;;
          esac

          case "$ARCHS" in
            *x86_64*)
              ;;
            *)
              echo "::error::선택한 Python에 x86_64 아키텍처가 없습니다: $ARCHS"
              exit 1
              ;;
          esac

          echo "python_bin=$PYTHON_BIN" >> "$GITHUB_OUTPUT"
      - name: Get version
        id: version
        run: |
          version=$(sed -n 's/.*__version__ = "\([^"]*\)".*/\1/p' version.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ matrix.include_jre }}" = "true" ]; then
            echo "asset=ExcelMerger-test-$version-macOS-x64-jre.dmg" >> "$GITHUB_OUTPUT"
          else
            echo "asset=ExcelMerger-test-$version-macOS-x64.dmg" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Python dependencies
        run: |
          "${{ steps.python.outputs.python_bin }}" -m venv venv
          ./venv/bin/python -m pip install --upgrade pip setuptools wheel
          ./venv/bin/pip install -r requirements.txt pyinstaller
          ./venv/bin/python -m pip check
      - name: Download Apache POI jars
        run: |
          mkdir -p lib/poi
          curl -fsSL -o lib/poi/poi-${POI_VERSION}.jar https://repo1.maven.org/maven2/org/apache/poi/poi/${POI_VERSION}/poi-${POI_VERSION}.jar
          curl -fsSL -o lib/poi/poi-ooxml-${POI_VERSION}.jar https://repo1.maven.org/maven2/org/apache/poi/poi-ooxml/${POI_VERSION}/poi-ooxml-${POI_VERSION}.jar
          curl -fsSL -o lib/poi/poi-ooxml-lite-${POI_VERSION}.jar https://repo1.maven.org/maven2/org/apache/poi/poi-ooxml-lite/${POI_VERSION}/poi-ooxml-lite-${POI_VERSION}.jar
          curl -fsSL -o lib/poi/commons-collections4-${COMMONS_COLLECTIONS4_VERSION}.jar https://repo1.maven.org/maven2/org/apache/commons/commons-collections4/${COMMONS_COLLECTIONS4_VERSION}/commons-collections4-${COMMONS_COLLECTIONS4_VERSION}.jar
          curl -fsSL -o lib/poi/commons-io-${COMMONS_IO_VERSION}.jar https://repo1.maven.org/maven2/commons-io/commons-io/${COMMONS_IO_VERSION}/commons-io-${COMMONS_IO_VERSION}.jar
          curl -fsSL -o lib/poi/commons-compress-${COMMONS_COMPRESS_VERSION}.jar https://repo1.maven.org/maven2/org/apache/commons/commons-compress/${COMMONS_COMPRESS_VERSION}/commons-compress-${COMMONS_COMPRESS_VERSION}.jar
          curl -fsSL -o lib/poi/commons-codec-${COMMONS_CODEC_VERSION}.jar https://repo1.maven.org/maven2/commons-codec/commons-codec/${COMMONS_CODEC_VERSION}/commons-codec-${COMMONS_CODEC_VERSION}.jar
          curl -fsSL -o lib/poi/xmlbeans-${XMLBEANS_VERSION}.jar https://repo1.maven.org/maven2/org/apache/xmlbeans/xmlbeans/${XMLBEANS_VERSION}/xmlbeans-${XMLBEANS_VERSION}.jar
          curl -fsSL -o lib/poi/log4j-api-${LOG4J_API_VERSION}.jar https://repo1.maven.org/maven2/org/apache/logging/log4j/log4j-api/${LOG4J_API_VERSION}/log4j-api-${LOG4J_API_VERSION}.jar
      - name: Bundle JRE
        if: matrix.include_jre
        run: |
          rm -rf lib/jre
          cp -R "$JAVA_HOME" lib/jre

      - name: Run unit tests
        if: ${{ !matrix.include_jre }}
        run: |
          ./venv/bin/python -m unittest discover -s tests -q
      - name: Install UPX
        run: |
          brew list upx >/dev/null 2>&1 || brew install upx
          upx --version
      - name: Build executable
        run: |
          EXCELMERGER_INCLUDE_JRE=${{ matrix.include_jre && '1' || '0' }} ./venv/bin/pyinstaller -y ExcelMerger.spec
      - name: Package DMG
        run: |
          mkdir -p release
          hdiutil create -volname ExcelMerger -srcfolder dist -ov -format UDZO "release/${{ steps.version.outputs.asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.asset }}
          path: release/${{ steps.version.outputs.asset }}
